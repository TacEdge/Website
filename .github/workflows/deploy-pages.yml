name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/new-session-d7yqqw, main, claude/tacedge-budget-pwa-nqsmb8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Website
      # Budget demo PWA (on-device data, no Supabase) served at /Website/budget/
      - run: npm ci
        working-directory: budget
      - run: npm run build
        working-directory: budget
        env:
          VITE_FORCE_DEMO: "true"
      - run: mv budget/dist out/budget
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
