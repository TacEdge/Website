/* TACEDGE design tokens — mirrors app/globals.css */
:root{
  --forest:#112411; --cream:#F7F5EC; --stage:#DDE3D2;
  --ink:#242A1F; --ink-60:#5B6253; --olive:#6E7D5C;
  --ui:'Be Vietnam Pro',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
/* Page = trim 90×55mm + 3mm bleed on every side. Supply to the printer
   as-is (no crop marks); trim size is 90×55mm. */
@page{size:96mm 61mm;margin:0}
html,body{margin:0;padding:0}
body{font-family:var(--ui);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card{
  width:96mm;height:61mm;position:relative;overflow:hidden;
  page-break-after:always;break-after:page;
}

/* ── Front: forest field, centred lockup ── */
.card--front{background:var(--forest);display:flex;align-items:center;justify-content:center}
.front-logo{width:49mm;height:auto;display:block}

/* ── Back: contact block + tonal brandmark ── */
.card--back{background:var(--cream)}
.back-motif{
  position:absolute;top:50%;transform:translateY(-50%);
  right:-14mm;width:49mm;height:auto;
}
.back-copy{
  position:absolute;left:10mm;top:50%;transform:translateY(-50%);
}
.back-name{font-weight:700;font-size:14pt;color:var(--forest);letter-spacing:.005em;line-height:1.15}
.back-role{margin-top:1.1mm;font-size:10pt;color:var(--ink-60)}
.back-rule{border:0;border-top:.6pt solid var(--olive);width:5.2mm;margin:3.4mm 0}
.back-contact{list-style:none;font-size:9pt;color:var(--ink);line-height:2.05}
</style>
